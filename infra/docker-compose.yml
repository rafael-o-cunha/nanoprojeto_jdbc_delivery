services:

  app:
    build:
      context: ..
      dockerfile: infra/app/Dockerfile

    container_name: jdbc_delivery_app

    user: "${UID:-1000}:${GID:-1000}"

    working_dir: /app

    volumes:
      - ../app:/app

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    depends_on:
      db:
        condition: service_healthy

    stdin_open: true
    tty: true

  db:
    image: postgres:16

    container_name: jdbc_delivery_db

    command:
      - postgres
      - -c
      - log_statement=all

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/tables.sql:/docker-entrypoint-initdb.d/tables.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery}"]
      interval: 10s
      timeout: 5s
      retries: 5